<div [formGroup]="parentForm" class="row gx-3">
    <div class="form-group col-md-12">
        <label>Main Title</label>
        <input type="text" class="form-control" placeholder="e.g., Cozy Downtown Apartment" formControlName="mainTitle"
               [class.is-invalid]="f['mainTitle'].invalid && f['mainTitle'].touched">
    </div>

    <div class="form-group col-sm-4">
        <label>Property Type</label>
        <select class="form-select" formControlName="type">
            <option *ngFor="let type of propertyTypes" [value]="type">{{ type }}</option>
        </select>
    </div>

    <div class="form-group col-sm-4">
        <label>Category</label>
        <select class="form-select" formControlName="category">
            <option *ngFor="let cat of propertyCategories" [value]="cat">{{ cat }}</option>
        </select>
    </div>

    <div class="form-group col-sm-4">
        <label>Status</label>
        <select class="form-select" formControlName="status">
            <option *ngFor="let stat of propertyStatuses" [value]="stat">{{ stat }}</option>
        </select>
    </div>

    <div class="form-group col-sm-6">
        <label>Price ($)</label>
        <input type="number" class="form-control" formControlName="price">
    </div>

    <div class="form-group col-sm-6">
        <label>Description</label>
        <textarea class="form-control" formControlName="description" rows="3"></textarea>
        <div *ngIf="f['description'].invalid && f['description'].touched" class="text-danger mt-1">
            <small *ngIf="f['description'].errors?.['minlength']">Description must be at least 50 characters.</small>
        </div>
    </div>
</div>
